<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';"><title>MultiApp Desktop</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#172232;background:#fff}*{box-sizing:border-box}body{margin:0}header{height:105px;border-bottom:1px solid #e4eaf0;background:#f8fafc}#titlebar{height:36px;display:flex;align-items:center;gap:12px;padding:0 14px;font-weight:650;font-size:13px}#tabs{height:34px;display:flex;align-items:end;gap:4px;padding:0 10px;overflow-x:auto;scrollbar-width:thin}.tab{flex:0 0 auto;min-width:105px;max-width:215px;border:1px solid #dce3ed;background:#eaf0f7;border-bottom:0;border-radius:9px 9px 0 0;padding:8px 12px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#384b64}.tab.active{background:white;color:#125ac0;font-weight:650}.tab.loading:before{content:'◌ ';color:#2563eb}#toolbar{height:35px;display:flex;align-items:center;gap:6px;padding:3px 10px;border-top:1px solid #e4eaf0}button{border:0;background:transparent;border-radius:5px;padding:5px 8px;cursor:pointer;color:#344456}button:hover{background:#e1e9f5}button:disabled{opacity:.35;cursor:default}#address{flex:1;min-width:0;border:1px solid #e1e7ee;border-radius:7px;background:white;font-size:12px;color:#506076;padding:6px 9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#error{color:#ad263b;font-size:11px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}#empty{padding:30px;color:#64748b;font-size:13px}
</style></head><body><header><div id="titlebar"><span id="title">MultiApp Desktop</span><span id="error"></span><span style="flex:1"></span><button id="edit" title="Open apps.json">Edit config</button><button id="refreshConfig" title="Reload apps.json">Reload config</button></div><nav id="tabs" role="tablist"></nav><div id="toolbar"><button id="back" title="Back">◀</button><button id="forward" title="Forward">▶</button><button id="reload" title="Reload">↻</button><button id="home" title="App home">⌂</button><div id="address"></div></div></header><script src="renderer.js"></script></body></html>
