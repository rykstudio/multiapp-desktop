name: Cross-platform builds
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: multiapp-release-v1.0.0
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate JavaScript syntax and JSON templates
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/settings-db.js
          node --check src/crypto-export.js
          node -e "const fs=require('fs');const t=JSON.parse(fs.readFileSync('config/import-template.json'));if(t.formatVersion!==1||!Array.isArray(t.apps)||t.apps.length<2||!t.apps.some(x=>x.logins.length>1))process.exit(1)"
      - name: Regression tests for application order
        run: node --test tests/*.test.js
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: multiapp-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Update v1.0.0 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: multiapp-*
          path: release-assets
      - name: Publish latest v1.0.0 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ "$TAG" != "v1.0.0" ]; then
            echo "Expected v1.0.0, got $TAG"
            exit 1
          fi
          mapfile -d '' ASSETS < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.zip' -o -iname '*.AppImage' -o -iname '*.deb' \) ! -name 'elevate.exe' -print0)
          if [ "${#ASSETS[@]}" -lt 5 ]; then
            echo "Incomplete platform artifacts. Release will not be modified."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The user explicitly requested keeping the same version. Update its binaries and tag.
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$TAG" --title "MultiApp Desktop v1.0.0" --notes "MultiApp Desktop v1.0.0: embedded SQLite settings storage, demo password fallback without OS keyring, AES-256-GCM encrypted JSON exports and imports, persistent tab order, tab-first window. Unsigned packages for Windows, macOS and Linux."
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "MultiApp Desktop v1.0.0" --notes "MultiApp Desktop v1.0.0 with JSON import, downloadable template and corrected demo-login editor. Unsigned cross-platform packages."
          fi
