name: Enterprise foundation validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [hardening/**]
permissions:
  contents: read
concurrency:
  group: enterprise-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Security and regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        shell: bash
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/settings-db.js
          node --check src/view-layout.js
          node --check src/crypto-export.js
          node --check src/popup-policy.js
      - name: Run entire Node.js regression suite
        shell: bash
        run: node --test tests/*.test.js

  create-lockfile:
    name: Generate reproducible dependency lockfile
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to the hardening branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock npm dependencies for reproducible builds"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
