name: Generate ZT application icons
on:
  push:
    branches: [feature/zt-app-icon]
    paths:
      - build/zt-multiapp-desktop.svg
      - scripts/generate-icons.py
      - .github/workflows/generate-icons.yml

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG rendering and icon conversion tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.8.2
      - name: Render platform icons
        run: python scripts/generate-icons.py
      - name: Commit generated icons to source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/icon.ico build/icon.icns build/icon.png src/assets/icon.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generate native platform icons from supplied artwork'
            git push origin HEAD:feature/zt-app-icon
          fi
